<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achyut Karthikeyan · Robotics</title>
<meta name="description" content="Achyut Karthikeyan's robotics journey through elementary, middle and high school: LEGO, FLL, VEX, FRC and Ball Boy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: composed and credible, a young engineer's professional portfolio
   IDEA: a project timeline chart beside a case-study notebook
   PICTURE: the left timeline graph itself, school stages as bands of rising blue, Ball Boy at the top
   COLOUR and TYPE: white and graphite, cobalt shades for the stages, tennis-ball yellow for Ball Boy; Inter Tight + Inter
   LAYOUT: compact hero, then a sticky timeline sidebar beside expandable project cards */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#0e0f12);--soft:light-dark(#f6f7f9,#15171b);--ink:light-dark(#111318,#eef0f3);--mute:light-dark(#5d6470,#9ba2ad);
 --rule:light-dark(#e6e8ec,#262a31);--acc:light-dark(#2448d8,#7b98ff);
 --p1:light-dark(#b9c7ff,#34417a);--p2:light-dark(#6f8cf2,#4f68d6);--p3:light-dark(#2448d8,#7b98ff);
 --dark:#0f1114;--ball:#d7f04a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Inter Tight",Inter,sans-serif;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:clamp(28px,3.2vw,38px);font-weight:600}
h3{font-size:clamp(20px,2vw,24px);font-weight:600}
h4{font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;margin-bottom:6px}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,20px)}
.eyebrow{font-size:14px;font-weight:600;color:var(--acc);margin-bottom:10px}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{font-family:"Inter Tight",Inter,sans-serif;font-weight:600;font-size:17px;text-decoration:none}
.brand span{color:var(--mute);font-weight:500}
.hlinks{display:flex;gap:4px}
.hlinks a{padding:10px 12px;border-radius:8px;font-size:15px;font-weight:500;color:var(--mute);text-decoration:none}
.hlinks a:hover{background:var(--soft);color:var(--ink)}
.hero{padding:clamp(44px,6vw,84px) 0 0}
.herogrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(38px,5.2vw,64px);font-weight:600;letter-spacing:-.025em}
.hero p{color:var(--mute);font-size:clamp(17px,1.5vw,19px);max-width:56ch;margin:16px 0 0}
.frame{margin:0;aspect-ratio:5/4;border-radius:20px;background:var(--soft);border:1px solid var(--rule);display:grid;place-items:center;overflow:hidden;position:relative}
.frame svg{width:82%}.frame img{width:100%;height:100%;object-fit:cover}
.frame figcaption{position:absolute;left:16px;bottom:12px;font-size:13px;color:var(--mute)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:clamp(36px,5vw,56px)}
.facts div{padding:18px 20px 18px 0}
.facts div+div{padding-left:20px;border-left:1px solid var(--rule)}
.facts small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.facts b{display:block;font-family:"Inter Tight",Inter,sans-serif;font-weight:600;font-size:clamp(17px,1.6vw,20px);line-height:1.3;margin-top:4px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:clamp(32px,4vw,64px);padding-top:clamp(44px,6vw,72px);padding-bottom:clamp(56px,7vw,96px)}
.side{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 104px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.side .sec{margin-bottom:28px}
.side .sectitle{display:flex;justify-content:space-between;align-items:baseline;font-family:"Inter Tight",Inter,sans-serif;font-weight:600;font-size:20px;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.side .sectitle small{font-family:Inter,sans-serif;font-size:13px;color:var(--mute);font-weight:500}
.phases{list-style:none;margin:0;padding:0}
.phase{position:relative;padding:0 0 18px 26px}
.phase::before{content:"";position:absolute;left:6px;top:6px;bottom:0;width:6px;border-radius:3px;background:var(--band)}
.phase:last-child::before{bottom:14px}
.phase>a{display:block;text-decoration:none;font-weight:600;font-size:15px;line-height:1.3}
.phase>a small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
.items{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.items a{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:38px;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:14px}
.items a::before{content:"";position:absolute;left:-26px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:3px solid var(--band)}
.items a small{color:var(--mute);font-size:12px;white-space:nowrap}
.items a:hover{background:var(--soft)}
.items a.on{background:var(--soft);font-weight:600}
.items a.on::before{background:var(--band)}
.items a.cap::before{border-color:#9db51d;background:var(--ball)}
.items a.cap{font-weight:600}
.legend{font-size:12px;color:var(--mute);margin-top:6px}
.phaseblock{margin-bottom:clamp(40px,5vw,64px)}
.phead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.phead p{margin:6px 0 0;color:var(--mute);max-width:60ch}
.phead .tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mute)}
.phead .tag i{width:22px;height:8px;border-radius:4px;background:var(--band)}
.tools{display:flex;gap:8px}
.tools button{font:500 14px Inter,sans-serif;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer}
.tools button:hover{background:var(--soft)}
details.card{border:1px solid var(--rule);border-radius:16px;background:var(--bg);margin-bottom:14px;transition:box-shadow .2s,border-color .2s}
details.card:hover{border-color:color-mix(in srgb,var(--band) 60%,var(--rule))}
details.card[open]{box-shadow:0 10px 30px rgba(17,19,24,.08);border-color:color-mix(in srgb,var(--band) 70%,var(--rule))}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:18px;padding:20px 22px;align-items:start}
summary::-webkit-details-marker{display:none}
summary .bar{align-self:stretch;border-radius:3px;background:var(--band)}
summary .kick{font-size:13px;color:var(--mute);font-weight:500}
summary .kick b{color:var(--ink);font-weight:600}
summary .gtitle{margin-top:6px;display:inline-block;font:600 13px "Inter Tight",Inter,sans-serif;color:var(--acc);background:color-mix(in srgb,var(--band) 18%,transparent);border-radius:6px;padding:2px 9px}
details.capcard summary .gtitle{color:var(--ball)}
summary h3{margin-top:4px}
summary .sum{margin:6px 0 0;color:var(--mute);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details[open] summary .sum{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12px;font-weight:500;padding:3px 9px;border-radius:6px;border:1px solid var(--rule);background:var(--soft)}
.more{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--acc);white-space:nowrap;padding-top:2px}
.more svg{width:16px;height:16px;transition:transform .25s}
details[open] .more svg{transform:rotate(180deg)}
details[open] .more .o{display:none}details:not([open]) .more .c{display:none}
.inner{padding:0 22px 24px 46px}
.game{font-size:14px;color:var(--mute);margin:0 0 14px}
.resp{margin:0 0 16px;padding:12px 16px;border-radius:10px;background:var(--soft);border-left:4px solid var(--band);font-size:15px}
.resp b{font-weight:600}
.result{margin-top:20px;padding:16px 18px;border-radius:12px;border:1px solid color-mix(in srgb,var(--band) 55%,var(--rule));background:color-mix(in srgb,var(--band) 10%,var(--bg))}
.result h4{color:var(--acc);font-weight:600}
.result p{margin:0;font-size:16px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-top:18px;border-top:1px solid var(--rule)}
.cols p,.cols ul{margin:0;font-size:15px}.cols ul{padding-left:18px}.cols li+li{margin-top:4px}
.design{margin-top:22px;border:1px solid var(--rule);border-radius:14px;background:var(--soft);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
.design.solo{grid-template-columns:minmax(0,1fr)}
.design h5{margin:0;font:600 16px "Inter Tight",Inter,sans-serif}
.tool{display:inline-block;margin-top:8px;font-size:13px;color:var(--mute);border:1px solid var(--rule);border-radius:6px;padding:2px 8px;background:var(--bg)}
.design p{margin:10px 0 0;font-size:15px;color:var(--mute)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.design .gallery{margin:0;grid-template-columns:repeat(2,minmax(0,1fr))}
.ph{aspect-ratio:3/2;border-radius:10px;border:1px dashed var(--rule);background:var(--bg);display:grid;place-items:center;color:var(--mute);font:13px Inter,sans-serif;padding:0}
.ph.cad{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:14px 14px}
.ph.real{border:1px solid var(--rule);overflow:hidden;cursor:zoom-in;position:relative;aspect-ratio:auto;display:flex;flex-direction:column;background:var(--soft);text-align:left}
.gallery .ph.real:only-child{grid-column:span 2}
.ph img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#f6f7f9}
.ph .figc{padding:8px 12px;font-size:13px;color:var(--mute);line-height:1.4}
.awards{margin-top:16px;display:grid;gap:6px}
.aw{display:flex;align-items:center;gap:10px;font-size:14px}
.aw::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--acc);flex:none}
.aw.none{color:var(--mute)}.aw.none::before{background:var(--rule)}
details.capcard{background:var(--dark);color:#eef0f3;border-color:#262a31;--band:var(--ball)}
details.capcard summary .kick,details.capcard summary .sum{color:#a7adb8}
details.capcard summary .kick b{color:var(--ball)}
details.capcard .chips span{background:#16191e;border-color:#2c3038;color:#d6dae1}
details.capcard .more{color:var(--ball)}
details.capcard .cols,details.capcard .pdr{border-color:#262a31}
details.capcard .design{background:#16191e;border-color:#262a31}
details.capcard .design p,details.capcard h4{color:#a7adb8}
details.capcard .tool{background:#0f1114;border-color:#2c3038;color:#a7adb8}
details.capcard .ph{background:#16191e;border-color:#353a43;color:#8f96a2}
details.capcard .ph.cad{background-image:linear-gradient(#262a31 1px,transparent 1px),linear-gradient(90deg,#262a31 1px,transparent 1px)}
details.capcard .aw::before{background:var(--ball)}details.capcard .aw.none{color:#8f96a2}details.capcard .aw.none::before{background:#353a43}
.capart{float:right;width:min(240px,34%);margin:0 0 10px 20px}
.tagline{font-size:17px;color:#d6dae1;margin:0 0 18px}
.pdr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-top:18px;border-top:1px solid #262a31;clear:both}
.pdr p{margin:0;font-size:15px}
.subh{margin:30px 0 10px;font:600 18px "Inter Tight",Inter,sans-serif}
.lin{width:100%;border-collapse:collapse;font-size:15px}
.lin td{padding:11px 0;border-top:1px solid #262a31;vertical-align:top}
.lin td:first-child{width:36%;padding-right:16px}
.lin a{color:#eef0f3;font-weight:600;text-decoration:none}.lin a:hover{color:var(--ball)}
.lin td:last-child{color:#a7adb8}
.prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;margin-top:6px}
.vision{font:500 clamp(18px,1.8vw,21px)/1.4 "Inter Tight",Inter,sans-serif;margin:0}
.who{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.who li{border:1px solid #2c3038;border-radius:999px;padding:4px 11px;font-size:13px}
.road{list-style:none;margin:0;padding:0}
.road li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #262a31;font-size:15px}
.road i{width:26px;height:26px;border-radius:50%;border:1.5px solid #3a3f49;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:#a7adb8}
.road .s-done i{background:var(--ball);border-color:var(--ball);color:#111}
.road .s-now i{border-color:var(--ball);color:var(--ball)}
.road small{font-size:12px;color:#a7adb8;white-space:nowrap}.road .s-now small{color:var(--ball);font-weight:600}
.next{background:var(--soft);border-top:1px solid var(--rule);padding:clamp(48px,6vw,80px) 0}
.next .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:end}
.next p{color:var(--mute);margin:12px 0 0;font-size:17px;max-width:52ch}
.mail{font:600 clamp(20px,2.2vw,26px) "Inter Tight",Inter,sans-serif;overflow-wrap:anywhere}
.mail small{display:block;font:500 13px Inter,sans-serif;color:var(--mute);margin-bottom:6px}
footer{border-top:1px solid var(--rule);font-size:14px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:22px;padding-bottom:22px}
dialog{border:0;padding:0;background:transparent;max-width:min(1000px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{max-width:100%;max-height:82vh;border-radius:10px;display:block}
dialog p{color:#fff;margin:10px 0 0;font-size:14px}
dialog button{position:fixed;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:0;font-size:22px;cursor:pointer}
@media(max-width:980px){
 .layout{grid-template-columns:minmax(0,1fr);gap:20px}
 .side{position:sticky;top:64px;z-index:20;max-height:none;overflow:visible;background:var(--bg);margin:0 calc(-1*max(4vw,20px));padding:10px max(4vw,20px);border-bottom:1px solid var(--rule)}
 .side .sectitle,.legend{display:none}.side .sec{margin:0}
 .phases{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
 .phase{padding:0;flex:none;display:flex;align-items:center;gap:6px}
 .phase::before{display:none}
 .phase>a{font-size:12px;color:var(--mute);white-space:nowrap;padding-right:2px}.phase>a small{display:none}
 .items{display:flex;margin:0;gap:4px}
 .items a{white-space:nowrap;border:1px solid var(--rule);border-radius:999px;min-height:36px;padding:0 12px 0 26px}
 .items a::before{left:9px;width:10px;height:10px;margin-top:-5px;border-width:2px}
 .items a small{display:none}
}
@media(max-width:780px){.herogrid,.design,.prod,.next .wrap{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(3){border-left:0;padding-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--rule)}.cols,.pdr{grid-template-columns:minmax(0,1fr)!important;gap:14px}.inner{padding:0 18px 20px}summary{padding:18px;gap:14px}.capart{float:none;width:70%;margin:0 auto 14px;display:block}.hlinks{display:none}}
@media(max-width:520px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.more .o,.more .c{display:none!important}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.more svg{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="hlinks" aria-label="Main"><a href="#journey">Journey</a><a href="#ball-boy" data-open="ball-boy">Ball Boy</a><a href="#contact">Contact</a></nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="herogrid">
        <div>
          <div class="eyebrow">Robotics portfolio</div>
          <h1 id="hHead"></h1>
          <p id="hIntro"></p>
        </div>
        <figure class="frame" id="heroFrame">
          <svg viewBox="0 0 400 300" role="img" aria-label="Line drawing of Ball Boy, a tennis ball collecting robot" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink)">
            <line x1="20" y1="252" x2="380" y2="252" stroke="var(--rule)"/>
            <rect x="110" y="142" width="200" height="78" rx="12"/>
            <path d="M110 198 L68 236 L128 236 L140 206"/><line x1="76" y1="230" x2="128" y2="230"/><line x1="86" y1="222" x2="132" y2="222"/>
            <rect x="130" y="70" width="160" height="72" rx="8"/>
            <line x1="170" y1="70" x2="170" y2="142"/><line x1="210" y1="70" x2="210" y2="142"/><line x1="250" y1="70" x2="250" y2="142"/>
            <g fill="#d7f04a" stroke="#9db51d"><circle cx="150" cy="118" r="13"/><circle cx="190" cy="124" r="13"/><circle cx="230" cy="114" r="13"/><circle cx="270" cy="122" r="13"/><circle cx="210" cy="92" r="13"/><circle cx="46" cy="238" r="13"/></g>
            <circle cx="150" cy="232" r="20"/><circle cx="150" cy="232" r="6"/><circle cx="280" cy="232" r="20"/><circle cx="280" cy="232" r="6"/>
            <rect x="185" y="164" width="70" height="28" rx="6"/>
            <g stroke="var(--mute)" stroke-width="1" font-family="Inter,sans-serif" font-size="11" fill="var(--mute)">
              <line x1="110" y1="270" x2="310" y2="270"/><line x1="110" y1="264" x2="110" y2="276"/><line x1="310" y1="264" x2="310" y2="276"/><text x="186" y="290" stroke="none">chassis</text>
              <line x1="320" y1="70" x2="320" y2="142"/><line x1="314" y1="70" x2="326" y2="70"/><line x1="314" y1="142" x2="326" y2="142"/><text x="330" y="110" stroke="none">hopper</text>
              <text x="30" y="210" stroke="none">intake</text>
            </g>
          </svg>
          <figcaption>Ball Boy · replace with a photo</figcaption>
        </figure>
      </div>
      <div class="facts" id="facts"></div>
    </div>
  </section>

  <div class="wrap layout" id="journey">
    <aside class="side" aria-label="Timeline"><nav id="sidenav"></nav></aside>
    <div id="sections"></div>
  </div>

  <section class="next" id="contact">
    <div class="wrap">
      <div><div class="eyebrow">What's next</div><h2>Still building.</h2><p id="nextText"></p></div>
      <div class="mail" id="mail"></div>
    </div>
  </section>
</main>

<footer><div class="wrap"><span id="fName"></span><span>achyutkarthikeyan.xyz</span></div></footer>

<dialog id="lb"><button type="button" id="lbX" aria-label="Close photo">×</button><img id="lbImg" alt=""><p id="lbCap"></p></dialog>

<script>
function startSite(){
  const S=window.SITE||{sections:[]};
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const bands=['var(--p1)','var(--p2)','var(--p3)','var(--p3)'];
  const chev='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const sections=S.sections||[];
  const items=[];sections.forEach(s=>(s.phases||[]).forEach(p=>(p.items||[]).forEach(it=>items.push(it))));

  const gallery=(photos,labels)=>{
    const p=(photos||[]).filter(x=>x&&x.src);
    if(p.length) return p.map(x=>`<button type="button" class="ph real" data-src="${esc(x.src)}" data-cap="${esc(x.caption)}"><img src="${esc(x.src)}" alt="${esc(x.caption||'Photo')}" loading="lazy">${x.caption?`<span class="figc">${esc(x.caption)}</span>`:''}</button>`).join('');
    return labels.map(l=>`<div class="ph${l.cad?' cad':''}">${l.t}</div>`).join('');
  };
  const awards=a=>{const r=(a||[]).filter(x=>x&&x.name);return r.length?r.map(x=>`<div class="aw"><span><b>${esc(x.name)}</b> · ${esc(x.event)}${x.year?', '+esc(x.year):''}</span></div>`).join(''):'<div class="aw none">Awards will be listed here</div>'};
  const design=d=>{
    if(!d) return '';
    const has=(d.images||[]).some(x=>x&&x.src);
    const g=has||d.cad!==false?`<div class="gallery">${gallery(d.images,[{t:'CAD screenshot',cad:1},{t:'Sketch or render',cad:1}])}</div>`:'';
    return `<div class="design${g?'':' solo'}"><div><h5>How I designed it</h5>${d.tool?`<span class="tool">${esc(d.tool)}</span>`:''}<p>${esc(d.how)}</p></div>${g}</div>`;
  };
  const pics=it=>`<div class="gallery">${gallery(it.photos,[{t:'Photo'},{t:'Photo'},{t:'Photo or video'}])}</div>`;
  const gameOk=it=>it.game&&!/^add /i.test(it.game);
  const learnedList=it=>`<ul>${(it.learned||[]).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
  const ballArt='<svg class="capart" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#eef0f3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="252" x2="390" y2="252" stroke="#353a43"/><rect x="110" y="142" width="200" height="78" rx="12"/><path d="M110 198 L68 236 L128 236 L140 206"/><rect x="130" y="70" width="160" height="72" rx="8"/><line x1="170" y1="70" x2="170" y2="142"/><line x1="210" y1="70" x2="210" y2="142"/><line x1="250" y1="70" x2="250" y2="142"/><g fill="#d7f04a" stroke="#9db51d"><circle cx="150" cy="118" r="13"/><circle cx="190" cy="124" r="13"/><circle cx="230" cy="114" r="13"/><circle cx="270" cy="122" r="13"/><circle cx="210" cy="92" r="13"/><circle cx="46" cy="238" r="13"/></g><circle cx="150" cy="232" r="20"/><circle cx="280" cy="232" r="20"/></svg>';

  const body=it=>{
    if(it.type==='capstone'){
      const pr=it.product,st={done:'Done',now:'In progress',next:'Planned'};
      return `${ballArt}${it.tagline?`<p class="tagline">${esc(it.tagline)}</p>`:''}
        <div class="pdr"><div><h4>The problem</h4><p>${esc(it.problem)}</p></div><div><h4>The design</h4><p>${esc(it.built)}</p></div><div><h4>The result</h4><p>${esc(it.result)}</p></div></div>
        <div class="cols" style="margin-top:20px;grid-template-columns:repeat(2,minmax(0,1fr))"><div><h4>What I enjoyed</h4><p>${esc(it.enjoyed)}</p></div><div><h4>What I learned</h4>${learnedList(it)}</div></div>
        ${design(it.design)}${pics(it)}${it.awards===false?'':`<div class="awards">${awards(it.awards)}</div>`}
        ${(it.lineage||[]).length?`<div class="subh">Built on everything before it</div><table class="lin"><tbody>${it.lineage.map(l=>`<tr><td><a href="#${esc(l.link||'journey')}" data-open="${esc(l.link||'')}">From ${esc(l.from)}</a></td><td>${esc(l.what)}</td></tr>`).join('')}</tbody></table>`:''}
        ${pr?`<div class="subh">From project to product</div><div class="prod"><div><p class="vision">${esc(pr.vision)}</p><ul class="who">${(pr.who||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div><ol class="road">${(pr.roadmap||[]).map((r,i)=>`<li class="s-${esc(r.status)}"><i>${r.status==='done'?'✓':i+1}</i><span>${esc(r.step)}</span><small>${st[r.status]||''}</small></li>`).join('')}</ol></div>`:''}`;
    }
    return `${it.game&&!gameOk(it)?`<p class="game">Season game: <b>${esc(it.game)}</b></p>`:''}${it.responsibility?`<p class="resp"><b>My role: ${esc((it.roles||[]).join(', '))}.</b> ${esc(it.responsibility)}</p>`:''}
      <div class="cols"><div><h4>What I built</h4><p>${esc(it.built)}</p></div><div><h4>What I enjoyed</h4><p>${esc(it.enjoyed)}</p></div><div><h4>What I learned</h4>${learnedList(it)}</div></div>
      ${design(it.design)}${pics(it)}${it.awards===false?'':`<div class="awards">${awards(it.awards)}</div>`}${it.nextStep?`<div class="result"><h4>What I want to do next</h4><p>${esc(it.nextStep)}</p></div>`:''}`;
  };
  const card=(it,band)=>`<details class="card${it.type==='capstone'?' capcard':''}" id="${esc(it.id)}" style="--band:${band}">
    <summary><span class="bar"></span><div><div class="kick"><b>${esc(it.stage)}</b> · ${esc(it.era)}</div>${gameOk(it)?`<div class="gtitle">${esc(it.game)}</div>`:''}<h3>${esc(it.title)}</h3><p class="sum">${esc(it.type==='capstone'?(it.tagline||it.problem):(it.responsibility||it.built))}</p><div class="chips">${(it.roles||[]).map(r=>`<span>${esc(r)}</span>`).join('')}${it.design?(it.design.cad===false?'<span>Sketches</span>':'<span>CAD</span>'):''}</div></div><span class="more"><span class="o">Read more</span><span class="c">Close</span>${chev}</span></summary>
    <div class="inner">${body(it)}</div></details>`;

  $('brand').innerHTML=`${esc(S.name)} <span>· Robotics</span>`;
  $('hHead').textContent=S.headline||'';
  $('hIntro').textContent=S.intro||'';
  $('fName').textContent='© '+new Date().getFullYear()+' '+(S.name||'');
  if(S.heroPhoto)$('heroFrame').innerHTML=`<img src="${esc(S.heroPhoto)}" alt="${esc(S.name)}">`;
  const programs=[...new Set(items.filter(i=>!/duplo|lego|capstone/.test(i.type)).map(i=>i.stage))];
  const roles=[...new Set(items.flatMap(i=>i.roles||[]).filter(r=>/lead|captain/i.test(r)))];
  const cap=items.find(i=>i.type==='capstone');
  $('facts').innerHTML=[['Building since',items[0]?items[0].era:''],['Robotics programs',programs.join(', ')],['Leadership',roles.map(r=>r[0].toUpperCase()+r.slice(1)).join(', ')],['Capstone',cap?cap.stage:'']].map(f=>`<div><small>${f[0]}</small><b>${esc(f[1])}</b></div>`).join('');

  $('sidenav').innerHTML=sections.map(s=>`<div class="sec"><div class="sectitle">${esc(s.title)}<small>${(s.phases||[]).reduce((n,p)=>n+(p.items||[]).length,0)} steps</small></div><ol class="phases">${(s.phases||[]).map((p,pi)=>`<li class="phase" style="--band:${bands[pi]}"><a href="#ph-${esc(p.id)}">${esc(p.title)}<small>${esc(p.years)}</small></a><ol class="items">${(p.items||[]).map(it=>`<li><a href="#${esc(it.id)}" data-open="${esc(it.id)}" class="${it.type==='capstone'?'cap':''}">${esc(gameOk(it)?it.game:it.stage)}<small>${esc((it.era||'').split('·')[0].trim())}</small></a></li>`).join('')}</ol></li>`).join('')}</ol></div>`).join('')+'<p class="legend">Click any step to open it.</p>';

  let first=true;
  $('sections').innerHTML=sections.map(s=>(s.phases||[]).map((p,pi)=>{const t=first;first=false;return `<section class="phaseblock" id="ph-${esc(p.id)}" style="--band:${bands[pi]}">
      <div class="phead"><div><div class="eyebrow">${esc(s.title)}</div><h2>${esc(p.title)}</h2><p>${esc(p.intro)}</p></div><div><span class="tag"><i></i>${esc(p.years)}</span></div></div>
      ${t?'<div class="tools" style="margin-bottom:14px"><button type="button" id="openAll">Open all</button><button type="button" id="closeAll">Close all</button></div>':''}
      ${(p.items||[]).map(it=>card(it,it.type==='capstone'?'var(--ball)':bands[pi])).join('')}
    </section>`}).join('')).join('');

  $('nextText').textContent=S.next||'';
  $('mail').innerHTML=S.contactEmail?`<small>Get in touch</small>${esc(S.contactEmail)}`:'';

  const openTo=id=>{const d=$(id);if(!d||d.tagName!=='DETAILS')return;d.open=true;requestAnimationFrame(()=>d.scrollIntoView({block:'start'}))};
  document.addEventListener('click',e=>{const a=e.target.closest('a[data-open]');if(!a||!a.dataset.open)return;e.preventDefault();try{history.replaceState(null,'','#'+a.dataset.open)}catch(_){}openTo(a.dataset.open)});
  addEventListener('hashchange',()=>openTo(location.hash.slice(1)));
  if(location.hash)openTo(location.hash.slice(1));
  const oa=$('openAll'),ca=$('closeAll');
  if(oa)oa.addEventListener('click',()=>document.querySelectorAll('details.card').forEach(d=>d.open=true));
  if(ca)ca.addEventListener('click',()=>document.querySelectorAll('details.card').forEach(d=>d.open=false));

  const navLinks=[...document.querySelectorAll('.items a')],cards=[...document.querySelectorAll('details.card')];
  const spy=()=>{
    let cur='';for(const c of cards){if(c.getBoundingClientRect().top<innerHeight*.35)cur=c.id}
    navLinks.forEach(a=>{const on=a.dataset.open===cur;if(on!==a.classList.contains('on')){a.classList.toggle('on',on);if(on&&innerWidth<=980)a.scrollIntoView({block:'nearest',inline:'center'})}});
  };
  addEventListener('scroll',spy,{passive:true});addEventListener('resize',spy);spy();

  const lb=$('lb');
  document.addEventListener('click',e=>{const b=e.target.closest('.ph.real');if(!b)return;$('lbImg').src=b.dataset.src;$('lbImg').alt=b.dataset.cap||'Photo';$('lbCap').textContent=b.dataset.cap||'';lb.showModal?lb.showModal():lb.setAttribute('open','')});
  $('lbX').addEventListener('click',()=>lb.close());
  lb.addEventListener('click',e=>{if(e.target===lb)lb.close()});
}
(function(){var t=document.createElement('script');t.src='content.js?v='+Date.now();t.onload=startSite;t.onerror=startSite;document.body.appendChild(t);})();
</script>
</body>
</html>
